services:
  web:
    build: .
    image: drainage-basemap:latest
    container_name: drainage-basemap
    ports:
      - "8000:8000"
    volumes:
      # SQLite 数据库持久化到宿主，容器重建不丢任务/锁定/快照
      - ./app/local_data:/app/local_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
